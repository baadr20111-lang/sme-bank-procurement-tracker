name: Procurement regression checks
on:
  push:
    paths: [index.html, tests/test_procurement.cjs, .github/workflows/procurement-checks.yml]
  pull_request:
    paths: [index.html, tests/test_procurement.cjs, .github/workflows/procurement-checks.yml]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node tests/test_procurement.cjs