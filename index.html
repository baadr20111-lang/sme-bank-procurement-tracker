<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>متابعة مشتريات المشروع</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
  :root{
    --navy:#16233F; --navy-light:#243B6B; --orange:#FF7704; --orange-soft:#FFE7D1;
    --teal:#2BB5A0; --bg:#FAF8F5; --card:#FFFFFF; --line:#E7E2D9;
    --text:#20242E; --text-dim:#767A85; --red:#D64545; --green:#2BB5A0;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{background:var(--bg);color:var(--text);
    font-family:"Segoe UI","Tahoma","Geeza Pro",system-ui,sans-serif;
    line-height:1.5;padding:0 0 80px;}
  .wrap{max-width:1000px;margin:0 auto;padding:0 20px;}
  header.top{background:var(--navy);color:#fff;padding:28px 0 24px;margin-bottom:22px;}
  header.top .wrap{display:flex;flex-direction:column;gap:16px;}
  .brand{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .brand h1{font-size:22px;margin:0;font-weight:700;}
  .brand p{margin:2px 0 0;color:#B9C2D6;font-size:13px;}
  .team-select{display:flex;gap:8px;align-items:center;font-size:13px;color:#CDD5E6;flex-wrap:wrap;}
  .team-select select{background:#22315A;color:#fff;border:1px solid #3A4A78;border-radius:8px;
    padding:6px 10px;font-size:13px;font-family:inherit;}
  #saveStatus{font-size:12px;min-width:120px;text-align:center;padding:5px 10px;border-radius:6px;
    background:#1a2846;transition:all .2s;}
  .overall{display:flex;gap:18px;align-items:center;background:#1D2C4E;border-radius:14px;
    padding:16px 18px;flex-wrap:wrap;}
  .ring{position:relative;width:64px;height:64px;flex:none;}
  .ring svg{transform:rotate(-90deg);}
  .ring .pct{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;
    font-size:14px;font-weight:700;}
  .overall-text{flex:1;min-width:180px;}
  .overall-text .big{font-size:19px;font-weight:700;}
  .overall-text .small{font-size:12.5px;color:#AEB8CE;margin-top:2px;}
  .overall-totals{display:flex;gap:8px;flex-wrap:wrap;}
  .total-pill{background:#243A66;border-radius:10px;padding:8px 12px;text-align:center;min-width:100px;}
  .total-pill .n{font-size:13px;font-weight:700;color:#fff;}
  .total-pill .l{font-size:10.5px;color:#AEB8CE;margin-top:2px;}
  .total-pill.grand{background:#2BB5A0;color:#fff;}
  .total-pill.grand .n{color:#fff;font-size:14px;}
  .total-pill.grand .l{color:#E6FFF9;}

  .filters{display:flex;gap:8px;margin-bottom:18px;flex-wrap:wrap;}
  .filter-btn{border:1px solid var(--line);background:var(--card);color:var(--text-dim);
    padding:7px 16px;border-radius:999px;font-size:13px;cursor:pointer;font-family:inherit;
    transition:all .15s;}
  .filter-btn.active{background:var(--navy);border-color:var(--navy);color:#fff;}
  .filter-btn:not(.active):hover{border-color:var(--orange);color:var(--orange);}
  .add-btn{background:var(--orange);color:#fff;border:none;padding:8px 16px;border-radius:999px;
    font-size:13px;cursor:pointer;font-family:inherit;font-weight:600;}
  .add-btn:hover{background:#E56700;}

  .phase{background:var(--card);border:1px solid var(--line);border-radius:16px;
    margin-bottom:16px;overflow:hidden;}
  .phase-head{display:flex;align-items:center;gap:14px;padding:16px 18px;cursor:pointer;user-select:none;}
  .phase-num{flex:none;width:34px;height:34px;border-radius:10px;background:var(--orange-soft);
    color:var(--orange);display:flex;align-items:center;justify-content:center;
    font-weight:700;font-size:14px;}
  .phase-title{flex:1;min-width:0;}
  .phase-title h2{margin:0;font-size:15.5px;}
  .phase-title .sub{font-size:12px;color:var(--text-dim);margin-top:1px;}
  .phase-progress-wrap{flex:none;width:130px;text-align:left;}
  .phase-progress-bar{height:6px;background:#EFEAE1;border-radius:99px;overflow:hidden;margin-bottom:4px;}
  .phase-progress-bar > div{height:100%;background:var(--teal);border-radius:99px;transition:width .3s;}
  .phase-progress-wrap .count{font-size:11px;color:var(--text-dim);}
  .chev{flex:none;color:var(--text-dim);transition:transform .2s;font-size:13px;}
  .phase.open .chev{transform:rotate(180deg);}
  .phase-body{border-top:1px solid var(--line);}
  .phase-body.collapsed{display:none;}

  .phase-totals{background:#F6F9F8;padding:12px 18px;border-top:1px solid var(--line);
    display:flex;gap:18px;flex-wrap:wrap;font-size:12.5px;}
  .phase-totals span{color:var(--text-dim);}
  .phase-totals b{color:var(--text);font-weight:700;}

  .item{display:flex;gap:12px;align-items:flex-start;padding:12px 18px;border-bottom:1px solid #F1EDE5;flex-wrap:wrap;}
  .item:last-child{border-bottom:none;}
  .item.done{background:#FAFCFA;}
  .item.partial{background:#fffdf8;}
  .item-row1{flex:1;min-width:250px;display:flex;flex-direction:column;gap:6px;}
  .item-name-input{font-size:14px;font-weight:600;border:1px dashed transparent;background:transparent;
    padding:4px 6px;border-radius:6px;font-family:inherit;color:var(--text);width:100%;}
  .item-name-input:hover{border-color:var(--line);background:#fff;}
  .item-name-input:focus{border-color:var(--orange);background:#fff;outline:none;}
  .item-desc{font-size:12px;color:var(--text-dim);padding:2px 6px;}
  .item-controls{display:flex;gap:8px;align-items:center;flex-wrap:wrap;padding:4px 6px;}
  .item-controls label{font-size:11.5px;color:var(--text-dim);display:flex;flex-direction:column;gap:2px;}
  .item-controls input{width:70px;padding:4px 6px;border:1px solid var(--line);border-radius:6px;
    font-family:inherit;font-size:12.5px;text-align:center;background:#fff;}
  .item-controls input:focus{border-color:var(--orange);outline:none;}
  .item-controls .tax-toggle{background:#F6F3EE;border:1px solid var(--line);border-radius:6px;
    padding:5px 8px;font-size:11.5px;cursor:pointer;font-family:inherit;}
  .item-controls .tax-toggle.included{background:#E4F7EE;border-color:#A9E3C4;color:#087d65;}
  .item-controls .tax-toggle.not-included{background:#FFF1DF;border-color:#F1C98E;color:#a76100;}

  .status-control{flex:none;min-width:118px;}
  .status-select{border:1px solid #d7dce5;border-radius:10px;padding:9px 28px 9px 10px;
    font-family:inherit;font-size:13px;background:#fff;cursor:pointer;width:100%;}
  .status-select.status-done{background:#e7f6f0;border-color:#b8e3d4;color:#087d65;}
  .status-select.status-partial{background:#fff1df;border-color:#f1c98e;color:#a76100;}
  .status-select.status-pending{background:#f6f6f4;color:#555;}

  .item-right{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px;min-width:130px;}
  .item-total{font-size:13px;font-weight:700;color:var(--text);}
  .item-total-tax{font-size:11px;color:var(--text-dim);}
  .item-actions{display:flex;gap:6px;align-items:center;}
  .assignee-sel{font-family:inherit;font-size:11.5px;border-radius:6px;padding:4px 6px;
    border:1px solid var(--line);background:#F6F3EE;color:var(--text);cursor:pointer;}
  .assignee-sel.set-بدر{background:#E7F0FF;border-color:#B7CFFA;}
  .assignee-sel.set-ريان{background:#FDEBD8;border-color:#F6CBA0;}
  .assignee-sel.set-سليمان{background:#E4F7EE;border-color:#A9E3C4;}
  .del-btn{background:transparent;border:1px solid #F1C0C0;color:#D64545;border-radius:6px;
    width:24px;height:24px;cursor:pointer;font-size:14px;line-height:1;padding:0;font-family:inherit;}
  .del-btn:hover{background:#FDEAEA;}

  .empty-msg{padding:24px;text-align:center;color:var(--text-dim);font-size:13px;}
  footer{max-width:1000px;margin:30px auto 0;padding:0 20px;color:var(--text-dim);
    font-size:11.5px;text-align:center;}
  @media (max-width:640px){
    .phase-progress-wrap{width:70px;}
    .item-right{min-width:100%;align-items:flex-start;}
  }
  @keyframes pulse{0%,100%{opacity:1;}50%{opacity:.5;}}
  .saving-pulse{animation:pulse 1s infinite;}
</style>
</head>
<body>

<div id="app">
<header class="top">
  <div class="wrap">
    <div class="brand">
      <div>
        <h1>متابعة مشتريات المشروع</h1>
        <p>بنك المنشآت الصغيرة والمتوسطة — تطوير الهوية البصرية للبيئة الداخلية</p>
      </div>
      <div class="team-select">
        <button id="refreshBtn" title="تحديث" style="background:#22315A;border:1px solid #3A4A78;color:#fff;border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;font-family:inherit;">⟳ تحديث</button>
        <span id="saveStatus">جاري الاتصال...</span>
        أنا:
        <select id="whoAmI">
          <option value="">اختر اسمك</option>
          <option value="بدر">بدر</option>
          <option value="ريان">ريان</option>
          <option value="سليمان">سليمان</option>
        </select>
      </div>
    </div>
    <div class="overall">
      <div class="ring">
        <svg width="64" height="64" viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="27" fill="none" stroke="#33436B" stroke-width="7"/>
          <circle id="ringProgress" cx="32" cy="32" r="27" fill="none" stroke="#FF7704" stroke-width="7"
                  stroke-linecap="round" stroke-dasharray="169.6" stroke-dashoffset="169.6"/>
        </svg>
        <div class="pct" id="ringPct">0%</div>
      </div>
      <div class="overall-text">
        <div class="big" id="overallCount">0 / 0 بند</div>
        <div class="small">عبر المراحل الثلاث</div>
      </div>
      <div class="overall-totals" id="overallTotals"></div>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="filters" id="filters">
    <button class="filter-btn active" data-f="الكل">الكل</button>
    <button class="filter-btn" data-f="بدر">بدر</button>
    <button class="filter-btn" data-f="ريان">ريان</button>
    <button class="filter-btn" data-f="سليمان">سليمان</button>
    <button class="filter-btn" data-f="غير محدد">غير محدد</button>
    <button class="filter-btn" data-f="متبقي" style="margin-right:auto;">المتبقي فقط</button>
  </div>
  <div id="phases"></div>
</div>

<footer>مزامنة لحظية عبر Supabase — أي تعديل يظهر فوراً لجميع الأطراف.</footer>
</div>

<script>
const SUPABASE_URL = "https://dekrtcjksdbymwbfuymh.supabase.co";
const SUPABASE_KEY = "sb_publishable_2yv2wAqRRX13dx8KIexKdQ_pyqG6Y4q";
const TAX_RATE = 0.15;

// ترتيب المراحل: الثانية أولاً
const PHASE_ORDER = [
  { key:"p2", title:"المرحلة الأولى", sub:"تجهيزات مكتب الرئيس وغرفة الاجتماعات" },
  { key:"p1", title:"المرحلة الثانية", sub:"تجهيزات المبنى بالهوية البصرية" },
  { key:"p3", title:"المرحلة الثالثة", sub:"اللوحات الخارجية للمبنى" }
];

let state = { items: {} };
let itemsMeta = {}; // id -> {name, description, unit, total_qty, unit_price, tax_included, phase, sort_order}
let currentFilter = "الكل";
let saveTimer = null;
let saveInFlight = false;
let dirtyLocal = false;
let supabaseClient = null;
let realtimeConnected = false;

function fmt(n){ return new Intl.NumberFormat('ar', {maximumFractionDigits:2}).format(n); }
function escapeHtml(s){ return String(s||'').replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }

function setStatus(text, color, pulse){
  const el = document.getElementById("saveStatus");
  if(!el) return;
  el.textContent = text;
  el.style.color = color || "#CDD5E6";
  el.classList.toggle("saving-pulse", !!pulse);
}

function sbHeaders(extra = {}){
  return Object.assign({
    "apikey": SUPABASE_KEY,
    "Content-Type": "application/json"
  }, extra);
}

async function sbFetch(path, options = {}){
  const res = await fetch(SUPABASE_URL + "/rest/v1/" + path, Object.assign({
    headers: sbHeaders()
  }, options));
  if(!res.ok){
    const text = await res.text();
    throw new Error("Supabase " + res.status + ": " + text);
  }
  if(res.status === 204) return null;
  const text = await res.text();
  return text ? JSON.parse(text) : null;
}

async function apiGet(){
  const data = await sbFetch("procurement_items?select=*");
  const items = {};
  const meta = {};
  (data || []).forEach(row => {
    items[row.id] = {
      done: !!row.done,
      assignee: row.assignee || "",
      completedQty: Number(row.completed_qty) || 0
    };
    meta[row.id] = {
      name: row.name || "",
      description: row.description || "",
      unit: row.unit || "وحدة",
      total_qty: Number(row.total_qty) || 1,
      unit_price: Number(row.unit_price) || 0,
      tax_included: !!row.tax_included,
      phase: row.phase || "p1",
      sort_order: Number(row.sort_order) || 0
    };
  });
  return { items, meta };
}

async function apiPut(data){
  const rows = Object.entries(data).map(([id, s]) => ({
    id,
    done: !!s.done,
    assignee: s.assignee || "",
    completed_qty: Math.max(0, Number(s.completedQty || 0)),
    name: s.name || "",
    description: s.description || "",
    unit: s.unit || "وحدة",
    total_qty: Math.max(0, Number(s.total_qty || 0)),
    unit_price: Math.max(0, Number(s.unit_price || 0)),
    tax_included: !!s.tax_included,
    phase: s.phase || "p1",
    sort_order: Number(s.sort_order || 0),
    updated_at: new Date().toISOString()
  }));
  if(!rows.length) return;
  saveInFlight = true;
  try{
    await sbFetch("procurement_items?on_conflict=id", {
      method: "POST",
      headers: sbHeaders({"Prefer":"resolution=merge-duplicates,return=minimal"}),
      body: JSON.stringify(rows)
    });
    dirtyLocal = false;
  } finally {
    saveInFlight = false;
  }
}

function applyRemoteRow(row){
  if(!row || !row.id) return;
  state.items[row.id] = {
    done: !!row.done,
    assignee: row.assignee || "",
    completedQty: Number(row.completed_qty) || 0
  };
  itemsMeta[row.id] = {
    name: row.name || "",
    description: row.description || "",
    unit: row.unit || "وحدة",
    total_qty: Number(row.total_qty) || 1,
    unit_price: Number(row.unit_price) || 0,
    tax_included: !!row.tax_included,
    phase: row.phase || "p1",
    sort_order: Number(row.sort_order) || 0
  };
}

function subscribeRealtime(){
  supabaseClient = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
  supabaseClient
    .channel('procurement-changes')
    .on('postgres_changes',
      { event: '*', schema: 'public', table: 'procurement_items' },
      (payload) => {
        if(saveInFlight || dirtyLocal) return;
        if(payload.eventType === 'DELETE'){
          const oldId = payload.old && payload.old.id;
          if(oldId){ delete state.items[oldId]; delete itemsMeta[oldId]; }
        } else {
          applyRemoteRow(payload.new);
        }
        render();
        setStatus("تحديث لحظي ✓", "#8DE0C8");
      }
    )
    .subscribe((status) => {
      if(status === 'SUBSCRIBED'){
        realtimeConnected = true;
        setStatus("متصل لحظياً ✓", "#8DE0C8");
      } else if(status === 'CHANNEL_ERROR' || status === 'TIMED_OUT'){
        realtimeConnected = false;
        setStatus("وضع احتياطي ⟳", "#FFD39B");
      } else if(status === 'CLOSED'){
        realtimeConnected = false;
        setStatus("غير متصل", "#FFB4A2");
      }
    });

  setInterval(async () => {
    if(realtimeConnected || dirtyLocal || saveInFlight) return;
    try{
      const remote = await apiGet();
      state = { items: remote.items };
      itemsMeta = remote.meta;
      render();
    }catch(e){ console.warn("fallback sync failed", e); }
  }, 30000);
}

async function loadState(){
  if(dirtyLocal || saveInFlight) return;
  try{
    setStatus("جاري التحديث...", "#CDD5E6", true);
    const remote = await apiGet();
    state = { items: remote.items };
    itemsMeta = remote.meta;
    if(!realtimeConnected) setStatus("متصل ✓", "#8DE0C8");
  }catch(e){
    console.log("remote load failed", e);
    setStatus("غير متصل", "#FFB4A2");
  }
  render();
}

function queueSave(ids){
  dirtyLocal = true;
  setStatus("جاري الحفظ...", "#FFD39B", true);
  const idsArr = Array.isArray(ids) ? ids : Object.keys(state.items);
  clearTimeout(saveTimer);
  saveTimer = setTimeout(async ()=>{
    const payload = {};
    idsArr.forEach(id => {
      payload[id] = Object.assign({}, state.items[id] || {}, itemsMeta[id] || {});
    });
    try{
      await apiPut(payload);
      setStatus(realtimeConnected ? "متصل لحظياً ✓" : "محفوظ ✓", "#8DE0C8");
    }catch(e){
      console.error("save failed", e);
      setStatus("فشل الحفظ", "#FFB4A2");
      dirtyLocal = true;
    }
  }, 400);
}

function getItemState(id){
  if(state.items[id]) return Object.assign({done:false, assignee:"", completedQty:0}, state.items[id]);
  return { done:false, assignee:"", completedQty:0 };
}

function getItemMeta(id){
  if(itemsMeta[id]) return Object.assign({name:"",description:"",unit:"وحدة",total_qty:1,unit_price:0,tax_included:false,phase:"p1",sort_order:0}, itemsMeta[id]);
  return { name:"", description:"", unit:"وحدة", total_qty:1, unit_price:0, tax_included:false, phase:"p1", sort_order:0 };
}

function setItemState(id, patch){
  state.items[id] = Object.assign({}, getItemState(id), patch);
  queueSave([id]);
}

function setItemMeta(id, patch){
  itemsMeta[id] = Object.assign({}, getItemMeta(id), patch);
  queueSave([id]);
}

function calcItem(id){
  const m = getItemMeta(id);
  const s = getItemState(id);
  const line = Number(m.total_qty) * Number(m.unit_price);
  const lineWithoutTax = m.tax_included ? line / (1 + TAX_RATE) : line;
  const lineTax = m.tax_included ? (line - lineWithoutTax) : (line * TAX_RATE);
  const lineWithTax = m.tax_included ? line : (line + lineTax);
  const completed = Math.min(Number(m.total_qty), Math.max(0, Number(s.completedQty || 0)));
  const pct = m.total_qty > 0 ? (completed / m.total_qty) : 0;
  return {
    total_qty: Number(m.total_qty),
    unit_price: Number(m.unit_price),
    line_without_tax: lineWithoutTax,
    line_tax: lineTax,
    line_with_tax: lineWithTax,
    completed,
    pct,
    done: completed >= Number(m.total_qty) && Number(m.total_qty) > 0
  };
}

function allIds(){ return Object.keys(itemsMeta); }

function render(){
  renderOverall();
  renderPhases();
}

function renderOverall(){
  const ids = allIds();
  let grandWithout = 0, grandTax = 0, grandWith = 0;
  let completedCount = 0, totalQty = 0, purchasedQty = 0;
  const counts = {"بدر":0,"ريان":0,"سليمان":0};

  ids.forEach(id => {
    const c = calcItem(id);
    grandWithout += c.line_without_tax;
    grandTax += c.line_tax;
    grandWith += c.line_with_tax;
    totalQty += c.total_qty;
    purchasedQty += c.completed;
    if(c.done){
      completedCount++;
      const s = getItemState(id);
      if(counts.hasOwnProperty(s.assignee)) counts[s.assignee]++;
    }
  });

  const pct = totalQty ? Math.round((purchasedQty / totalQty) * 100) : 0;
  document.getElementById("overallCount").textContent = `${completedCount} / ${ids.length} بند مكتمل`;
  document.getElementById("ringPct").textContent = pct + "%";
  const circumference = 169.6;
  document.getElementById("ringProgress").style.strokeDashoffset = String(circumference - (circumference * pct / 100));

  document.getElementById("overallTotals").innerHTML = `
    <div class="total-pill"><div class="n">${fmt(grandWithout)}</div><div class="l">بدون ضريبة</div></div>
    <div class="total-pill"><div class="n">${fmt(grandTax)}</div><div class="l">الضريبة 15%</div></div>
    <div class="total-pill grand"><div class="n">${fmt(grandWith)}</div><div class="l">الإجمالي مع الضريبة</div></div>
  `;
}

function itemPassesFilter(id){
  const s = getItemState(id);
  const c = calcItem(id);
  if(currentFilter === "الكل") return true;
  if(currentFilter === "متبقي") return !c.done;
  if(currentFilter === "غير محدد") return !s.assignee;
  return s.assignee === currentFilter;
}

function renderPhases(){
  const container = document.getElementById("phases");
  container.innerHTML = "";

  PHASE_ORDER.forEach((ph, idx) => {
    const phaseIds = allIds().filter(id => getItemMeta(id).phase === ph.key)
      .sort((a,b) => getItemMeta(a).sort_order - getItemMeta(b).sort_order);

    let phaseWithout = 0, phaseTax = 0, phaseWith = 0, phaseDone = 0, phaseTotalQty = 0, phasePurchased = 0;
    phaseIds.forEach(id => {
      const c = calcItem(id);
      phaseWithout += c.line_without_tax;
      phaseTax += c.line_tax;
      phaseWith += c.line_with_tax;
      phaseTotalQty += c.total_qty;
      phasePurchased += c.completed;
      if(c.done) phaseDone++;
    });
    const phPct = phaseTotalQty ? Math.round((phasePurchased / phaseTotalQty) * 100) : 0;
    const visibleIds = phaseIds.filter(itemPassesFilter);

    const phaseEl = document.createElement("div");
    phaseEl.className = "phase open";

    const head = document.createElement("div");
    head.className = "phase-head";
    head.innerHTML = `
      <div class="phase-num">${idx+1}</div>
      <div class="phase-title">
        <h2>${escapeHtml(ph.title)}</h2>
        <div class="sub">${escapeHtml(ph.sub)}</div>
      </div>
      <div class="phase-progress-wrap">
        <div class="phase-progress-bar"><div style="width:${phPct}%"></div></div>
        <div class="count">${phasePurchased}/${phaseTotalQty} كمية · ${phaseDone}/${phaseIds.length} بند</div>
      </div>
      <div class="chev">▾</div>
    `;
    const body = document.createElement("div");
    body.className = "phase-body";

    if(visibleIds.length === 0){
      body.innerHTML = `<div class="empty-msg">لا توجد بنود مطابقة للفلتر الحالي</div>`;
    }else{
      visibleIds.forEach(id => body.appendChild(renderItemRow(id)));
    }

    // إجماليات المرحلة
    const totals = document.createElement("div");
    totals.className = "phase-totals";
    totals.innerHTML = `
      <span>إجمالي المرحلة:</span>
      <span>بدون ضريبة: <b>${fmt(phaseWithout)}</b> ريال</span>
      <span>الضريبة: <b>${fmt(phaseTax)}</b> ريال</span>
      <span>مع الضريبة: <b>${fmt(phaseWith)}</b> ريال</span>
    `;
    body.appendChild(totals);

    head.addEventListener("click", () => {
      phaseEl.classList.toggle("open");
      body.classList.toggle("collapsed");
    });

    phaseEl.appendChild(head);
    phaseEl.appendChild(body);
    container.appendChild(phaseEl);
  });
}
